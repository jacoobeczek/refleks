<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151f" id="themeColor">
<title>Refleks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #12151f;
    color: #fff;
    transition: background-color 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 18px)
             calc(env(safe-area-inset-right, 0px) + 24px)
             calc(env(safe-area-inset-bottom, 0px) + 18px)
             calc(env(safe-area-inset-left, 0px) + 24px);
  }
  body.waiting, body.tooSoon { background-color: #bf1c1c; }
  body.ready { background-color: #1a9e3d; }
  body.finished { background-color: #1a3373; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .brand {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 3px;
    opacity: 0.7;
  }
  .best {
    font-size: 15px;
    font-weight: 600;
    opacity: 0.7;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    cursor: pointer;
  }
  .main-text {
    font-size: clamp(44px, 16vw, 90px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1px;
    font-family: "SF Pro Rounded", -apple-system, inherit;
  }
  .sub-text {
    font-size: clamp(15px, 4vw, 19px);
    font-weight: 500;
    line-height: 1.45;
    opacity: 0.85;
    max-width: 30em;
    white-space: pre-line;
  }
  .btn {
    appearance: none;
    border: 0;
    outline: 0;
    font: inherit;
    font-size: 23px;
    font-weight: 700;
    color: #fff;
    background: rgba(255, 255, 255, 0.18);
    padding: 17px 44px;
    border-radius: 18px;
    width: min(100%, 340px);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.28); }
  .btn[hidden] { display: none; }
  footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 14px;
    opacity: 0.55;
    min-height: 1.4em;
  }
</style>
</head>
<body class="idle">

  <header>
    <div class="brand">REFLEKS</div>
    <div class="best" id="bestLabel">Rekord: —</div>
  </header>

  <main id="stage">
    <div class="main-text" id="mainText">REFLEKS</div>
    <div class="sub-text" id="subText">5 rund. Poczekaj, aż ekran zrobi się zielony, i dotknij go najszybciej, jak potrafisz.</div>
    <button class="btn" id="actionBtn">GRAJ</button>
  </main>

  <footer id="roundLabel"></footer>

<script>
  "use strict";

  const TOTAL_ROUNDS = 5;
  const stage = document.getElementById("stage");
  const mainText = document.getElementById("mainText");
  const subText = document.getElementById("subText");
  const actionBtn = document.getElementById("actionBtn");
  const roundLabel = document.getElementById("roundLabel");
  const bestLabel = document.getElementById("bestLabel");

  let phase = "idle"; // idle | waiting | ready | tooSoon | roundDone | finished
  let results = [];
  let startDate = 0;
  let timer = null;
  let best = parseInt(localStorage.getItem("refleksBest") || "0", 10) || 0;

  function rand(min, max) { return min + Math.random() * (max - min); }

  function buzz(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  function startGame() {
    clearTimeout(timer);
    results = [];
    scheduleReady();
  }

  function scheduleReady() {
    phase = "waiting";
    render();
    clearTimeout(timer);
    timer = setTimeout(function () {
      startDate = performance.now();
      phase = "ready";
      render();
      buzz(25);
    }, rand(1500, 4000));
  }

  function handleStageTap() {
    if (phase === "waiting") {
      clearTimeout(timer);
      phase = "tooSoon";
      buzz([50, 70, 50]);
      render();
    } else if (phase === "ready") {
      const ms = Math.round(performance.now() - startDate);
      results.push(ms);
      if (best === 0 || ms < best) {
        best = ms;
        localStorage.setItem("refleksBest", String(best));
      }
      buzz(45);
      phase = "roundDone";
      render();
    }
  }

  function nextRound() {
    if (results.length >= TOTAL_ROUNDS) {
      phase = "finished";
      render();
    } else {
      scheduleReady();
    }
  }

  function setAction(label, handler) {
    actionBtn.hidden = false;
    actionBtn.textContent = label;
    actionBtn.onclick = handler;
  }

  function hideAction() {
    actionBtn.hidden = true;
    actionBtn.onclick = null;
  }

  function render() {
    document.body.className = phase;
    bestLabel.textContent = best > 0 ? "Rekord: " + best + " ms" : "Rekord: —";
    roundLabel.textContent = "";

    switch (phase) {
      case "idle":
        mainText.textContent = "REFLEKS";
        subText.textContent = "5 rund. Poczekaj, aż ekran zrobi się zielony, i dotknij go najszybciej, jak potrafisz.";
        setAction("GRAJ", startGame);
        break;

      case "waiting":
        mainText.textContent = "Czekaj…";
        subText.textContent = "Nie klikaj!";
        hideAction();
        roundLabel.textContent = "Runda " + (results.length + 1) + " z " + TOTAL_ROUNDS;
        break;

      case "ready":
        mainText.textContent = "DOTKNIJ!";
        subText.textContent = "";
        hideAction();
        roundLabel.textContent = "Runda " + (results.length + 1) + " z " + TOTAL_ROUNDS;
        break;

      case "tooSoon":
        mainText.textContent = "Za wcześnie!";
        subText.textContent = "Ekran musi się zrobić zielony.";
        setAction("Powtórz rundę", scheduleReady);
        break;

      case "roundDone": {
        const ms = results[results.length - 1];
        mainText.textContent = ms + " ms";
        subText.textContent = "To Twój wynik w tej rundzie.";
        const isLast = results.length >= TOTAL_ROUNDS;
        setAction(isLast ? "Zobacz wynik" : "Dalej", nextRound);
        roundLabel.textContent = "Runda " + results.length + " z " + TOTAL_ROUNDS;
        break;
      }

      case "finished": {
        const avg = Math.round(results.reduce(function (a, b) { return a + b; }, 0) / results.length);
        const fastest = Math.min.apply(null, results);
        mainText.textContent = "Średnia: " + avg + " ms";
        subText.textContent = "Najszybsza runda: " + fastest + " ms\nRekord: " + (best > 0 ? best + " ms" : "—");
        setAction("Zagraj jeszcze raz", startGame);
        break;
      }
    }
  }

  stage.addEventListener("click", function (e) {
    if (e.target && e.target.closest && e.target.closest("button")) return;
    handleStageTap();
  });

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  render();
</script>
</body>
</html>
